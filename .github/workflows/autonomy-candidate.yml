name: Autonomy candidate checks

on:
  pull_request:
    paths:
      - 'src/lunabotics_autonomy/**'
      - '.github/workflows/autonomy-candidate.yml'
  push:
    paths:
      - 'src/lunabotics_autonomy/**'

jobs:
  pure-python:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install numpy setuptools wheel
      - run: python -m unittest discover -s tests -q
        working-directory: src/lunabotics_autonomy
      - run: python -m compileall -q autonomy launch
        working-directory: src/lunabotics_autonomy
      - run: python -m pip wheel --no-deps --no-build-isolation .
        working-directory: src/lunabotics_autonomy
