guidance_controller:
  ros__parameters:
    rate_hz: 20.0

    lookahead_m: 0.5
    cruise_speed: 0.3

    goal_tolerance_m: 0.10
    yaw_tolerance_rad: 0.10

    rotate_in_place_angle_rad: 1.05

    max_cross_track_m: 0.75

    max_linear_speed: 0.5
    max_angular_speed: 1.0

    max_linear_accel: 0.5
    max_angular_accel: 1.5

    odom_timeout_s: 0.5
    rotate_exit_ratio: 0.5
    rotate_gain: 1.5
    min_speed: 0.05
    min_lookahead_m: 0.15
    progress_window: 20
    goal_decel_ratio: 0.8
