guidance_controller:
  ros__parameters:
    rate_hz: 20.0

    lookahead_m: 0.5
    cruise_speed: 0.3

    goal_tolerance_m: 0.10
    yaw_tolerance_rad: 0.10

    rotate_in_place_angle_rad: 1.05

    max_cross_track_m: 0.75

    max_linear_speed: 0.5
    max_angular_speed: 1.0

    max_linear_accel: 0.5
    max_angular_accel: 1.5

    odom_timeout_s: 0.5
    rotate_exit_ratio: 0.5
    rotate_gain: 1.5
    min_speed: 0.05
    progress_window: 20
    goal_decel_ratio: 0.8

    # NEW PARAMETERS

    lookahead_time_s: 1.5
    min_lookahead_m: 0.15
    max_lookahead_m: 0.9

    regulated_min_radius_m: 0.9
    proximity_clearemce_m: 0.4
    approach_dist_m: 0.6

    min_regulated_speed: 0.08
    min_approach_speed: 0.05
    
    collision_check_time_s: 1.0
    occupied_threshold: 1 # eventually grid values will be in [0, 1] instead of just 0 or 1

