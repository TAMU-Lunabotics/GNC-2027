# luna_scorer configuration. Thresholds are data, not code: change them here.
# All units SI.

# Robot footprint in base_link. TODO: read from luna_description/config/robot_geometry.yaml
# so it can't drift from the description. x_offset = footprint center ahead of base_link.
footprint:
  length: 1.20
  width: 0.80
  x_offset: 0.0
  y_offset: 0.0

# Fallback arena size if arena_<seed>.json doesn't carry its dimensions.
arena:
  length: 6.88
  width: 5.0

localization:
  settle_s: 1.0        # ignore the first second (TF / filter startup)
  max_gap_s: 0.5       # an estimate gap longer than this counts as a dropout

collisions:
  contact_tol_m: 0.0   # clearance <= this is contact
  check_walls: true

cycles:
  min_dump_kg: 0.05    # dumped-mass increase that counts as one dump

stuck:
  cmd_eps: 0.02        # |cmd| above this = commanding motion (m/s, rad/s)
  move_eps: 0.01       # true speed below this = not moving
  min_duration_s: 1.0
  cmd_hold_s: 0.5      # command timeout from the contract

# Hard gates. Any failure fails the run. `metric` is a path into the report's `metrics`.
# Add `allow_missing: true` to a gate that shouldn't fail runs where the metric can't be
# computed (e.g. cycles in a pure-driving test).
gates:
  - name: no_collisions
    metric: collisions.collisions
    op: "<="
    value: 0
  - name: no_crater_entries
    metric: collisions.crater_entries
    op: "<="
    value: 0
  - name: no_wall_contact
    metric: collisions.wall_contacts
    op: "<="
    value: 0
  - name: localization_max_error
    metric: localization.pos_err_max_m
    op: "<="
    value: 0.15
  - name: localization_coverage
    metric: localization.coverage
    op: ">="
    value: 0.95
  - name: at_least_one_cycle
    metric: cycles.cycles_completed
    op: ">="
    value: 1
    allow_missing: true

# Topic overrides, if a run used different names than sim_interfaces.md.
# topics:
#   est_odom: /odometry/filtered
