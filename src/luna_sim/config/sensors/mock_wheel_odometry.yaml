mock_wheel_odometry:
  ros__parameters:
    rate_hz: 50.0
    ticks_per_rev: 4096
    # Wheel angular-speed Gaussian noise: sigma = noise_std_rad_s + noise_per_rad_s * abs(wheel_speed).
    # First-pass assumptions; calibrate from real encoders later.
    noise_std_rad_s: 0.01
    noise_per_rad_s: 0.01
    # geometry_yaml and seed are provided by level1.launch.py.
